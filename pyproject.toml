[project]
name = "qclaudecodesettingeditorwidget"
dynamic = ["version"]  # = 번들 메타데이터를 생성한 Claude Code 버전 (_version.py)
description = "PySide6 widget that edits every key of Claude Code settings.json (schema-driven, incl. env variables)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-qt>=4.2", "jsonschema>=4.0"]

[project.scripts]
qclaudecodesettingeditor = "qclaudecodesettingeditorwidget.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qclaudecodesettingeditorwidget*"]

[tool.setuptools.dynamic]
version = {attr = "qclaudecodesettingeditorwidget._version.__version__"}

[tool.setuptools.package-data]
# locales/ 를 빼면 git·wheel 설치본에서 번역 파일이 없어 language="ko" 가 영어로 나온다(editable 설치에서만 보였다).
qclaudecodesettingeditorwidget = ["resources/*.json", "locales/*.qm", "locales/*.ts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 스키마 밖 키(futureKey 등)를 일부러 쓰는 테스트가 많다 — 경고 자체는 test_validation 이 pytest.warns 로 검사한다
filterwarnings = ["ignore::qclaudecodesettingeditorwidget.validation.SettingValidationWarning"]

[tool.pyright]
extraPaths = ["tools"]
